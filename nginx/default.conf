map $args $public_entry {
    default index.html;
    ~*(^|&)(Inputs?|Input2|Settings|MaskSettings|PC|Screen|Config|IP|Port)= viewer.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Portable multiview URLs carry both screens and their layer settings.
    large_client_header_buffers 4 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Old links to / or /index.html still load the transparent viewer.
    location = / { try_files /$public_entry =404; }
    location = /index.html { try_files /$public_entry =404; }
    location = /control-api { return 404; }
    location = /presence-api { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
